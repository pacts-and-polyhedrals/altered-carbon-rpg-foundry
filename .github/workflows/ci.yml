name: Validate Foundry System
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: node scripts/verify-release.mjs
      - name: Ensure validation did not rewrite committed source
        run: git diff --exit-code
