# Optional maintainer tool. The normal release route remains the original manual upload.
name: Publish Foundry Release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundry-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require the original main-branch publication route
        run: |
          test "$GITHUB_REF" = refs/heads/main
      - name: Test the source exactly as committed, without rewriting manifests
        run: npm run release:check
      - name: Ensure validation did not rewrite committed source
        run: git diff --exit-code
      - name: Publish matching assets and verify the original update URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-release.sh
